name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

  data:
    name: Validate data file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate oss-macos.json
        run: |
          python3 - <<'EOF'
          import json

          required = {"name", "repo_url", "homepage", "description",
                      "license", "category", "macos_native",
                      "last_commit_verified", "oss_verified",
                      "source_url", "status"}
          statuses = {"active", "maintenance", "archived"}
          categories = {"developer-tools", "productivity", "utilities",
                        "media", "design", "security-privacy",
                        "terminal-system", "notes-knowledge",
                        "communication", "browsers"}

          data = json.load(open("data/oss-macos.json"))
          assert isinstance(data, list) and data, "oss-macos.json must be a non-empty list"
          for i, e in enumerate(data):
              missing = required - e.keys()
              assert not missing, f"entry {i} ({e.get('name')}) missing {missing}"
              assert e["category"] in categories, f"entry {i} bad category {e['category']}"
              assert e["status"] in statuses, f"entry {i} bad status {e['status']}"
              assert isinstance(e["oss_verified"], bool), f"entry {i} oss_verified not bool"
              assert isinstance(e["last_commit_verified"], bool), f"entry {i} last_commit_verified not bool"
              assert isinstance(e["macos_native"], bool), f"entry {i} macos_native not bool"
              assert e["repo_url"].startswith("https://github.com/"), \
                  f"entry {i} repo_url must be https://github.com/..."
              if e["homepage"]:
                  assert e["homepage"].startswith("https://"), f"entry {i} homepage must be https"
              if e["oss_verified"]:
                  assert e["source_url"].startswith("https://"), \
                      f"entry {i} verified entry needs https source_url"
                  assert e["license"] != "unverified", \
                      f"entry {i} verified entry must name a license"
          names = [e["name"] for e in data]
          assert len(names) == len(set(names)), "duplicate names"
          print(f"OK: data/oss-macos.json: {len(data)} entries validated")
          EOF
