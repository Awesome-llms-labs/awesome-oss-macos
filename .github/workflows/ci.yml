name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true

  data:
    name: Validate data file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate macos.json
        run: |
          python3 - <<'EOF'
          import json

          required = {"name", "description", "license", "category",
                      "github_url", "stars", "official_site",
                      "apple_silicon", "verified", "verified_source",
                      "unverified_reason"}
          categories = {"window-management", "launcher", "clipboard",
                        "screenshot-recording", "terminal", "editor-ide",
                        "dev-tools", "package-scripting", "media-player",
                        "media-tools", "audio", "streaming",
                        "system-utility", "archiver", "cleaner", "menu-bar",
                        "backup-sync", "security", "productivity",
                        "accessibility", "browser", "misc"}

          data = json.load(open("data/macos.json"))
          assert isinstance(data, list) and data, "macos.json must be a non-empty list"
          for i, e in enumerate(data):
              missing = required - e.keys()
              assert not missing, f"entry {i} ({e.get('name')}) missing {missing}"
              assert e["category"] in categories, f"entry {i} bad category {e['category']}"
              assert isinstance(e["verified"], bool), f"entry {i} verified not bool"
              assert e["github_url"].startswith("https://github.com/"), \
                  f"entry {i} github_url must be a https://github.com/ URL"
              assert e["stars"] is None or isinstance(e["stars"], int), \
                  f"entry {i} stars must be int or null"
              if e["verified"]:
                  assert e["verified_source"].startswith("https://"), \
                      f"entry {i} verified entry needs https verified_source"
              else:
                  assert e["unverified_reason"], \
                      f"entry {i} unverified entry needs unverified_reason"
          names = [e["name"] for e in data]
          assert len(names) == len(set(names)), "duplicate names"
          verified = sum(1 for e in data if e["verified"])
          print(f"OK: data/macos.json: {len(data)} entries validated "
                f"({verified} verified, {len(data) - verified} unverified)")
          EOF
